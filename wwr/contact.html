<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Water Rafting | Contact Us</title>
    <meta name="description" content="Discover our rafting adventures, history, and mission.">
    <meta name="author" content="Athieno Peace">
    <link rel="stylesheet" href="styles/rafting.css">
</head>


<body>
    <header>
        <img src="images/z-wwr-oars.png" alt="Rafting Site Logo">


        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <!-- Company Info -->
        <section class="company-info">
            <h2>Contact Information</h2>
            <p>Address: 123 River Road, Makindye, Kampala, Uganda</p>
            <p>Phone: +256-0774312752</p>
            <p>Email: athienopeace355@gmail.com</p>
            <iframe src="YOUR_GOOGLE_MAP_EMBED_URL" width="600" height="450" allowfullscreen=""
              loading="lazy"></iframe>
        </section>

        <!-- Employees -->
        <section class="employees">
            <h2>Meet Our Team</h2>
            <figure>
                <img src="images/employee1.webp" alt="John Doe - Guide">
                <figcaption>John Doe – Lead Guide</figcaption>
            </figure>
            <figure>
                <img src="images/employee2.webp" alt="Jane Smith - Manager">
                <figcaption>Jane Smith – Operations Manager</figcaption>
            </figure>
            <figure>
                <img src="images/employee3.webp" alt="Mark Lee - Safety Officer">
                <figcaption>Mark Lee – Safety Officer</figcaption>
            </figure>
        </section>

        <!-- Contact Form -->
        <section class="contact-form">
            <h2>Send Us a Message</h2>
            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <p>Purpose of Message:</p>
                <label><input type="radio" name="purpose" value="general"> General
                    Inquiry</label>
                <label><input type="radio" name="purpose" value="reservation"> Reservation
                    Question</label>
                <label><input type="radio" name="purpose" value="suggestion"> Website
                    Suggestion</label>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5"></textarea>

                <label><input type="checkbox" name="newsletter"> Please subscribe me to the
                    monthly
                    newsletter</label>

                <button type="submit">Send Message</button>
            </form>
        </section>

    </main>

    <footer>
        <p>©2026 White Water Rafting | Athieno Peace</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook-square.svg" alt="Facebook"></a>
            <a href="https://twitter.com"><img src="images/twitter.png" alt="Twitter"></a>
            <a href="https://instagram.com"><img src="images/instagram.svg" alt="Instagram"></a>
        </nav>
    </footer>
</body>

</html>
